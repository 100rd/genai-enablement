apiVersion: v1
kind: Pod
metadata:
  name: splatform-gp3-smoke-writer
  namespace: splatform
  labels:
    app.kubernetes.io/name: splatform-gp3-smoke
    app.kubernetes.io/role: writer
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: storage-writer
      image: public.ecr.aws/docker/library/busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - set -C && printf 'splatform-gp3 smoke ok\n' > /data/marker && sync && cat /data/marker
      volumeMounts:
        - name: durable-data
          mountPath: /data
  volumes:
    - name: durable-data
      persistentVolumeClaim:
        claimName: splatform-gp3-smoke
