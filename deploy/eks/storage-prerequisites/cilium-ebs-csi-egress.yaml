apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: splatform-ebs-csi-aws-api
  namespace: kube-system
  labels:
    app.kubernetes.io/managed-by: genai-enablement
spec:
  endpointSelector:
    matchLabels:
      app: ebs-csi-controller
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: ec2.eu-central-1.amazonaws.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
