apiVersion: v1
kind: Pod
metadata:
  name: splatform-gp3-smoke-reader
  namespace: splatform
  labels:
    app.kubernetes.io/name: splatform-gp3-smoke
    app.kubernetes.io/role: reader
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: storage-reader
      image: public.ecr.aws/docker/library/busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - test "$(cat /data/marker)" = 'splatform-gp3 smoke ok' && cat /data/marker
      volumeMounts:
        - name: durable-data
          mountPath: /data
          readOnly: true
  volumes:
    - name: durable-data
      persistentVolumeClaim:
        claimName: splatform-gp3-smoke
