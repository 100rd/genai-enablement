apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniscience-postgres-data-retained
  namespace: splatform
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: splatform-gp3
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: omniscience-postgres-restore
  namespace: splatform
spec:
  selector:
    app.kubernetes.io/instance: omniscience-postgres-restore
    app.kubernetes.io/name: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: omniscience-postgres-restore-probe
  namespace: splatform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: omniscience-postgres-restore
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: omniscience-storage-probe
              app.kubernetes.io/component: storage-auth-probe
      ports:
        - protocol: TCP
          port: 5432
